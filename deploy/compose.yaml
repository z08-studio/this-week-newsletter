name: this-week-newsletter

services:
  site:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    user: "65534:65534"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    # The official Caddy binary carries this file capability, even on a high port.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 64m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    volumes:
      - type: bind
        source: ${NEWSLETTER_DEPLOY_ROOT:?Set NEWSLETTER_DEPLOY_ROOT}/releases
        target: /srv/releases
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${NEWSLETTER_DEPLOY_ROOT}/config/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${NEWSLETTER_DEPLOY_ROOT}/data
        target: /srv/data
        read_only: true
        bind: { create_host_path: false }
    networks:
      gateway:
        aliases: [this-week-newsletter]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  refresher:
    image: node:24-alpine
    user: "65534:65534"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 64m
    command: ["node", "/app/refresh-issues.mjs", "--daemon"]
    environment:
      ISSUES_SEED_PATH: /app/recentIssues.json
      ISSUES_OUTPUT_PATH: /data/recent-issues.json
      ISSUES_INTERVAL_MS: "7200000"
    volumes:
      - type: bind
        source: ${NEWSLETTER_DEPLOY_ROOT:?Set NEWSLETTER_DEPLOY_ROOT}/data
        target: /data
        bind: { create_host_path: false }
      - type: bind
        source: ${NEWSLETTER_DEPLOY_ROOT}/config/refresh-issues.mjs
        target: /app/refresh-issues.mjs
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${NEWSLETTER_DEPLOY_ROOT}/config/recentIssues.json
        target: /app/recentIssues.json
        read_only: true
        bind: { create_host_path: false }
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

networks:
  gateway:
    external: true
    name: ${NEWSLETTER_DOCKER_NETWORK:?Set NEWSLETTER_DOCKER_NETWORK}
